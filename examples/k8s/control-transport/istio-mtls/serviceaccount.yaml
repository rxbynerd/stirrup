# The identity job Pods run as. Istio derives the Pod's mesh identity
# (cluster.local/ns/stirrup-jobs/sa/stirrup-job) from it, and
# authorization-policy.yaml admits only that identity to the control plane.
# A dedicated ServiceAccount keeps any other workload in the namespace from
# carrying the same identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stirrup-job
  namespace: stirrup-jobs
# The sidecar gets its own projected token for the mesh certificate; the
# harness needs an API token only when it runs the k8s executor.
automountServiceAccountToken: false
