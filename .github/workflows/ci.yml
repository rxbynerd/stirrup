name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      run_quirks_suites:
        description: 'Also run the self-pinned provider-quirk suites (Terra/Sol grade — costs materially more than the Luna gate)'
        required: false
        default: false
        type: boolean

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/_verify.yml

  eval-gate:
    name: Eval Gate
    runs-on: ubuntu-latest
    needs: verify
    # SCOPED TO main AND workflow_dispatch ON PURPOSE — this is a cost
    # control, not an oversight. Live eval runs spend real tokens on
    # every invocation, and running them per-push across every active
    # branch multiplies that by the branch count for a signal that main
    # will produce anyway a few minutes later. Even on promotionally
    # priced models the per-push shape is what makes the bill grow
    # without bound.
    #
    # Do not "fix" this by widening the trigger. If a branch needs the
    # signal before merge, run the workflow on demand
    # (`gh workflow run ci.yml --ref <branch>`), which also gates the
    # expensive provider-quirk suites behind an explicit input.
    #
    # An earlier revision of this file described the non-main skip as an
    # accident of the Anthropic WIF federation rule (which pinned the
    # OIDC ref claim to refs/heads/main) and told operators to widen the
    # rule so branch pushes would run live. That advice was wrong about
    # the intent: main-only is the desired posture, and this `if:` now
    # enforces it at the job level rather than leaving it to a
    # credential-side accident.
    #
    # Missing credentials (fork clones, Dependabot-actor pushes —
    # neither can read this repository's Actions secrets) still skip
    # gracefully via the check-creds step, so that failure mode never
    # masquerades as an eval regression.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    env:
      # Cheap-model configuration for the gate. Its job is "did the
      # harness regress on tasks it used to pass", not "measure the best
      # model", so it runs the cheapest model that clears the suite
      # reliably. The stronger-model sweep runs at release time
      # (release.yml::eval-extended, Sonnet 5 + Opus 4.8).
      #
      # GPT-5.6 Luna over OpenRouter replaced Claude Haiku 4.5 here, on
      # cost alone: ~$0.10/M input and ~$0.60/M output against Haiku
      # 4.5's ~$1/$5 and GPT-5.6 Terra's ~$1/$6, which works out at
      # roughly $0.01 per full dogfood-seed run instead of ~$0.09.
      #
      # It is NOT the fix for the flake that had this gate red on main
      # from run 30163743698. That was a false positive in the
      # sensitive-data detector — the runner's own workspace path
      # matched the OpenAI-key pattern and latched Rule-of-Two, revoking
      # run_command mid-run — and it reproduced on Haiku, Luna, and
      # Terra alike. It is fixed in harness/internal/security
      # (boundary-anchored sk- patterns); swapping models here would not
      # have helped. Post-fix, Luna and Terra both pass the suite 3/3.
      # Luna wins on price.
      #
      # All four are forwarded to every harness invocation by
      # stirrup-eval, whose explicit flags override both the harness
      # defaults and anything the suite's run_config block pins.
      EVAL_MODEL: openai/gpt-5.6-luna
      EVAL_PROVIDER: openai-compatible
      EVAL_BASE_URL: https://openrouter.ai/api/v1
      # A secret:// reference, not a key: the harness resolves it
      # through SecretStore against the step env at runtime, so no key
      # is ever written into a RunConfig or a trace.
      EVAL_API_KEY_REF: secret://OPENROUTER_API_KEY
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            harness/go.mod
            types/go.mod
            eval/go.mod

      - name: Compute version label
        id: ver
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "label=main" >> "$GITHUB_OUTPUT"
          else
            echo "label=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          go build -trimpath \
            -ldflags="-X github.com/rxbynerd/stirrup/types/version.version=${{ steps.ver.outputs.label }} -X github.com/rxbynerd/stirrup/types/version.commit=${{ steps.ver.outputs.sha }}" \
            -o stirrup ./harness/cmd/stirrup
          go build -trimpath \
            -ldflags="-X github.com/rxbynerd/stirrup/types/version.version=${{ steps.ver.outputs.label }} -X github.com/rxbynerd/stirrup/types/version.commit=${{ steps.ver.outputs.sha }}" \
            -o stirrup-eval ./eval/cmd/eval

      - name: Check for eval suites
        id: check-suites
        shell: bash
        run: |
          shopt -s nullglob
          suites=(eval/suites/*.hcl)
          if [ ${#suites[@]} -gt 0 ]; then
            echo "has_suites=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_suites=false" >> "$GITHUB_OUTPUT"
            echo "No eval suites found — skipping eval gate"
          fi

      # Pre-flight credential guard. Without it, a missing key would
      # silently fail every harness invocation with an auth error
      # buried in per-task output, and the compare step would report a
      # 5/5 → 0/5 "regression" that is really an auth gap. Mirrors the
      # check-suites step's shape so an operator reviewing the job log
      # sees the same skip-with-warning pattern for both prerequisites.
      #
      # The empty-secret case is expected, not exceptional: fork clones
      # and Dependabot-actor pushes both run this workflow without
      # access to the repository's Actions secrets. Skipping is the
      # correct outcome for those, and the warning makes the skip
      # visible rather than silent.
      - name: Check eval credentials
        id: check-creds
        if: steps.check-suites.outputs.has_suites == 'true'
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            echo "has_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No OPENROUTER_API_KEY secret in scope (expected for forks and Dependabot pushes, which cannot read this repository's Actions secrets). Skipping live eval runs."
          fi

      # Preflight the credential before spending any eval time.
      # check-creds only proves the secret is non-empty; the key can
      # still be revoked, out of credit, or typo'd. The harness
      # --dry-run preflight performs the real credential resolution and
      # probes the provider's models metadata endpoint; no completion
      # tokens are spent, and its per-step report names the failing
      # step in the job log.
      #
      # Failure is unconditionally fatal. Under the previous Anthropic
      # WIF posture this step downgraded to a warning off main, because
      # the federation rule legitimately refused non-main-ref OIDC
      # tokens and a hard failure there would have been noise. A
      # repository secret has no such ref sensitivity, and the job's
      # `if:` already restricts execution to main and manual dispatch:
      # if this job is running at all and the probe fails, something is
      # genuinely broken. Failing red keeps the gate from silently
      # decaying into the no-op it was previously rescued from.
      - name: Preflight provider credential
        id: preflight
        if: steps.check-suites.outputs.has_suites == 'true' && steps.check-creds.outputs.has_credentials == 'true'
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p preflight-workspace
          if ./stirrup harness --dry-run \
              --provider "$EVAL_PROVIDER" \
              --base-url "$EVAL_BASE_URL" \
              --api-key-ref "$EVAL_API_KEY_REF" \
              --model "$EVAL_MODEL" \
              --workspace preflight-workspace \
              --trace preflight-trace.jsonl \
              --prompt "preflight"; then
            echo "preflight_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Eval gate preflight failed: credential resolution or the provider probe failed (see the preflight report above). This is an infrastructure/credential failure, NOT an eval regression — do not regenerate baselines in response. Check that the OPENROUTER_API_KEY secret is current and the account has credit."
            exit 1
          fi

      - name: Run eval suite
        if: steps.check-suites.outputs.has_suites == 'true' && steps.check-creds.outputs.has_credentials == 'true' && steps.preflight.outputs.preflight_ok == 'true'
        shell: bash
        env:
          # Resolved inside each harness subprocess via the
          # secret://OPENROUTER_API_KEY reference in EVAL_API_KEY_REF.
          # stirrup-eval passes the reference, never the value.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Empty on a push event; only workflow_dispatch supplies it.
          RUN_QUIRKS: ${{ inputs.run_quirks_suites }}
        run: |
          shopt -s nullglob
          mkdir -p eval/results
          for suite in eval/suites/*.hcl; do
            name=$(basename "$suite")
            name="${name%.*}"
            # Self-pinned suites carry their own provider posture in a
            # run_config block, including the model. Passing the gate's
            # --model on top would silently override the pin (explicit
            # flags beat --config by design) and collapse a Terra/Sol
            # matrix into another Luna run — the exact silent
            # nullification eval/suites/README.md warns about. They also
            # cost materially more than the Luna gate, so the
            # run_quirks_suites dispatch input is their opt-in.
            #
            # This case deliberately precedes the baseline check below.
            # The explicit dispatch input is already a stronger opt-in
            # than baseline presence, and a quirk suite must be runnable
            # BEFORE it has a baseline — the first live run is what
            # produces the result.json a baseline is minimised from.
            # Once baselined, the compare step gates it like any other
            # suite; until then compare skips it with a message.
            case "$name" in
              provider-quirks-*)
                if [ "${RUN_QUIRKS:-false}" != "true" ]; then
                  echo "Skipping ${name} — self-pinned quirk suite; re-run via workflow_dispatch with run_quirks_suites=true"
                  continue
                fi
                echo "Running ${name} with its own pinned provider/model (no --model override)"
                ./stirrup-eval run \
                  --suite "$suite" \
                  --harness "$GITHUB_WORKSPACE/stirrup" \
                  --output "eval/results/${name}" \
                  --junit "eval/results/${name}/junit.xml"
                continue
                ;;
            esac

            # Only baselined suites are gated. Unbaselined suites
            # (guardrail needs a local vLLM endpoint; tooluse's
            # no-credential gate is the in-process replay test — see
            # eval/suites/README.md) are opt-in local runs: executing
            # them here would spend tokens, produce failure noise, and
            # enforce nothing, since the compare step below skips
            # suites without a baseline anyway.
            if [ ! -f "eval/baselines/${name}.json" ]; then
              echo "Skipping ${name} — no baseline at eval/baselines/${name}.json (unbaselined suites are opt-in; see eval/suites/README.md)"
              continue
            fi

            # JUnit XML is an annotation/artifact only; the eval gate
            # is enforced by the `compare` step below.
            #
            # --harness is absolute: the runner execs it with cmd.Dir set
            # to each task's temp workspace, so a relative path would be
            # resolved against that workspace and fail. The runner also
            # anchors relative paths to absolute defensively, but passing
            # an absolute path here keeps the intent obvious.
            ./stirrup-eval run \
              --suite "$suite" \
              --harness "$GITHUB_WORKSPACE/stirrup" \
              --provider "$EVAL_PROVIDER" \
              --base-url "$EVAL_BASE_URL" \
              --api-key-ref "$EVAL_API_KEY_REF" \
              --model "$EVAL_MODEL" \
              --output "eval/results/${name}" \
              --junit "eval/results/${name}/junit.xml"
          done

      - name: Compare against baseline
        # Gated on has_credentials and preflight_ok in addition to
        # has_suites: without them the Run eval suite step is skipped,
        # so there is no result.json to compare. Without this guard
        # the loop body would skip silently (nullglob), but the
        # explicit gate makes the dependency between the steps
        # readable in the job log.
        if: steps.check-suites.outputs.has_suites == 'true' && steps.check-creds.outputs.has_credentials == 'true' && steps.preflight.outputs.preflight_ok == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          for result_dir in eval/results/*/; do
            name=$(basename "$result_dir")
            result="${result_dir}result.json"
            baseline="eval/baselines/${name}.json"
            if [ -f "$baseline" ]; then
              ./stirrup-eval compare \
                --current "$result" \
                --baseline "$baseline"
            else
              echo "No baseline found at $baseline — skipping comparison"
            fi
          done

      - name: Upload eval results
        # Always upload whatever made it to disk so result.json survives
        # an unrelated failure (e.g. compare step regression exit, future
        # secondary-artifact steps). The eval-gate's pass/fail signal is
        # carried by the compare step's exit code, not artifact presence.
        # Gated on has_credentials and preflight_ok so a skipped run
        # does not upload an empty artifact directory.
        if: always() && steps.check-suites.outputs.has_suites == 'true' && steps.check-creds.outputs.has_credentials == 'true' && steps.preflight.outputs.preflight_ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: eval/results/
          retention-days: 30

  publish-container:
    name: Publish Container
    runs-on: ubuntu-latest
    needs: verify
    # Belt-and-braces fork guard mirroring the publish jobs elsewhere.
    # ci.yml's publish-container is GHCR-only; the GAR dual-publish
    # path lives in release.yml::publish-container. Dev images
    # (:latest, :main, :sha-<7>) are deliberately kept out of GAR
    # because containerscanning.googleapis.com (enabled project-wide
    # per docs/container-publishing.md) auto-scans on every GAR push
    # and bills per scan — sending one scan per main commit is the
    # line item that made the GCP bill exceed token spend. Releases
    # still dual-publish, and free continuous CVE re-evaluation
    # against loaded SBOMs continues for everything already in GAR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'rxbynerd/stirrup'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Mirrors the eval-gate version-computation step. The `if:` guard
      # above currently restricts this job to refs/heads/main pushes, so
      # `label` will always be `main` today; computing it indirectly
      # keeps the build-args block honest if that condition is ever
      # relaxed (e.g. tag-triggered runs added) and prevents the
      # VERSION literal from drifting from the actual ref.
      - name: Compute version label
        id: ver
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "label=main" >> "$GITHUB_OUTPUT"
          else
            echo "label=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # SHA-pinned to v3.7.0. SHA verified via the GitHub API on
      # 2026-05-10 (`gh api repos/docker/setup-qemu-action/git/refs/tags/v3.7.0`,
      # which also matches the v3 floating tag's current target).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # SHA-pinned to v4.0.0. SHA verified via the GitHub API on
      # 2026-05-10 (`gh api repos/docker/setup-buildx-action/git/refs/tags/v4.0.0`,
      # which also matches the v4 floating tag's current target). Pinned
      # for the same reason as login-action: runs inside the
      # credentialled push job and a retargeted floating tag could
      # exfiltrate the GHCR token in env.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # SHA-pinned to v4.1.0. SHA verified via the GitHub API on
      # 2026-05-10 (`gh api repos/docker/login-action/git/refs/tags/v4.1.0`,
      # which also matches the v4 floating tag's current target). This
      # action receives the GHCR credentials as `password:`; pinning
      # to an immutable commit is non-negotiable here.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA-pinned to v6.0.0. SHA verified via the GitHub API on
      # 2026-05-10 (`gh api repos/docker/metadata-action/git/refs/tags/v6.0.0`,
      # which also matches the v6 floating tag's current target). Pinned
      # for the same reason as login-action: runs inside the credentialled
      # publish job and constructs the tag list that build-push-action
      # consumes — a retargeted tag could redirect pushes.
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/rxbynerd/stirrup
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      # SHA-pinned to v7.1.0. SHA verified via the GitHub API on
      # 2026-05-10 (`gh api repos/docker/build-push-action/git/refs/tags/v7.1.0`,
      # which also matches the v7 floating tag's current target). This
      # action performs the actual push using the live GHCR + GAR
      # credentials; pinning to an immutable commit is non-negotiable
      # here for the same reason as gcp-auth and login-action.
      - name: Build and push container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.label }}
            COMMIT=${{ steps.ver.outputs.sha }}

  publish-sandbox-container:
    name: Publish Sandbox Container
    runs-on: ubuntu-latest
    needs: verify
    # Same guard and GHCR-only posture as publish-container above (see
    # the comments there for the GAR cost rationale). The sandbox image
    # (Dockerfile.sandbox) is what the container/k8s/k8s-sandbox
    # executors run agent workloads in — it contains no Go build, so
    # there is no VERSION/COMMIT build-arg step to mirror.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'rxbynerd/stirrup'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Action pins below mirror publish-container above; see the
      # comments there for the SHA-verification provenance.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/rxbynerd/stirrup-sandbox
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push sandbox image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.sandbox
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
