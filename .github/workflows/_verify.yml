name: Verify (reusable)

# Reusable verify job invoked by ci.yml on every push and by release.yml
# at the start of every tagged release. Centralising it keeps the gate
# identical between routine CI and release builds — if the tagged SHA
# can't pass this, it can't be released.

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref to check out and test. Defaults to github.sha, which is
          correct for ci.yml's per-push invocation. release.yml passes the
          resolved release tag here so a workflow_dispatch retrigger tests the
          tagged commit rather than whatever main currently points at.
        type: string
        required: false
        default: ''

jobs:
  verify:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Empty inputs.ref falls through to actions/checkout's default
          # (github.sha), preserving behaviour for ci.yml callers that
          # don't pass the input.
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            harness/go.mod
            types/go.mod
            eval/go.mod
            examples/controlplane/go.mod

      - name: Compute version label
        id: ver
        env:
          # Prefer the resolved input ref when set so a tag-push or a
          # workflow_dispatch-triggered tag run produces a label of the
          # tag name rather than "dev". Fall back to GITHUB_REF for the
          # default ci.yml invocation.
          REF: ${{ inputs.ref != '' && format('refs/tags/{0}', inputs.ref) || github.ref }}
        run: |
          if [ "$REF" = "refs/heads/main" ]; then
            label="main"
          elif [[ "$REF" == refs/tags/* ]]; then
            label="${REF#refs/tags/}"
          else
            label="dev"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Run type module tests
        working-directory: types
        run: go test ./...

      - name: Run harness module tests
        working-directory: harness
        run: go test ./...

      - name: Run eval module tests
        working-directory: eval
        run: go test ./...

      - name: Run control-plane example tests
        working-directory: examples/controlplane
        run: go test ./...

      # Race-detector pass over the goroutine-heavy packages (executor
      # — which includes egressproxy — provider, and core). Scoped
      # rather than ./... because the full sweep under -race is much
      # slower for little extra concurrency coverage; the targeted set
      # adds only a few seconds. Keep the package list in sync with
      # the `test-race` recipe in the justfile.
      - name: Run race detector on concurrency-heavy packages
        run: go test -race ./harness/internal/executor/... ./harness/internal/provider/... ./harness/internal/core/...

      # Short fuzz runs of the scrubber's streaming, span and fence invariants.
      # A minimise time of zero keeps a failure from stalling the job. A
      # failing input is written under testdata/fuzz, which the next step
      # uploads so it can be committed as a seed. Fuzzing is random, so it
      # runs only in routine CI: a release gate (inputs.ref set) reruns the
      # committed seeds through `go test` above instead.
      - name: Fuzz the secret scrubber
        id: fuzz
        if: inputs.ref == ''
        working-directory: harness
        run: |
          go test ./internal/security/ -run '^$' -fuzz '^FuzzStreamCarry$' -fuzztime 20s -fuzzminimizetime 0
          go test ./internal/security/ -run '^$' -fuzz '^FuzzScrubWithSpans$' -fuzztime 20s -fuzzminimizetime 0
          go test ./internal/security/ -run '^$' -fuzz '^FuzzScrubFenced$' -fuzztime 20s -fuzzminimizetime 0

      - name: Upload failing fuzz input
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failure
          path: harness/internal/security/testdata/fuzz/

      - name: Build stirrup binary
        working-directory: harness
        env:
          VERSION_LABEL: ${{ steps.ver.outputs.label }}
          COMMIT_SHA: ${{ steps.ver.outputs.sha }}
        run: |
          go build -trimpath \
            -ldflags="-X github.com/rxbynerd/stirrup/types/version.version=${VERSION_LABEL} -X github.com/rxbynerd/stirrup/types/version.commit=${COMMIT_SHA}" \
            ./cmd/stirrup

      - name: Build control-plane example
        working-directory: examples/controlplane
        run: go build -o /dev/null . ./stubprovider

      - name: Build eval binary
        env:
          VERSION_LABEL: ${{ steps.ver.outputs.label }}
          COMMIT_SHA: ${{ steps.ver.outputs.sha }}
        run: |
          go build -trimpath \
            -ldflags="-X github.com/rxbynerd/stirrup/types/version.version=${VERSION_LABEL} -X github.com/rxbynerd/stirrup/types/version.commit=${COMMIT_SHA}" \
            -o stirrup-eval ./eval/cmd/eval

      # A build or test that rewrites a committed checksum file means the
      # commit is missing that change. Failing here keeps the drift from
      # reappearing as an uncommitted diff in every contributor's checkout.
      - name: Check module checksum files are committed
        run: |
          set -euo pipefail
          git diff --exit-code -- go.work.sum ':(glob)**/go.sum'
          untracked="$(git ls-files --others --exclude-standard -- go.work.sum ':(glob)**/go.sum')"
          if [ -n "$untracked" ]; then
            echo "::error::uncommitted checksum files: ${untracked}"
            exit 1
          fi

      # Runs the tool-use suite through the binaries built above from its
      # recordings: no provider credential, no network. `stirrup-eval run`
      # exits zero on failed tasks (gating is the compare subcommand's
      # job), so the pass rate is checked here. See eval/suites/README.md.
      - name: Run the replayed tool-use suite
        id: tooluse-replay
        env:
          STIRRUP: ${{ github.workspace }}/harness/stirrup
          OUT: ${{ runner.temp }}/tooluse-replay
        run: |
          set -euo pipefail
          ./stirrup-eval run --suite eval/suites/tooluse.hcl \
            --harness "${STIRRUP}" --output "${OUT}"
          if ! jq -e '.passRate == 1 and .healthyPassRate == 1' "${OUT}/result.json" > /dev/null; then
            echo "::error::replayed tool-use suite did not pass every task"
            jq '.tasks[] | select(.outcome != "pass") | {taskId, outcome, error, judgeVerdict}' "${OUT}/result.json"
            exit 1
          fi

      - name: Upload replayed tool-use suite artifacts
        if: failure() && steps.tooluse-replay.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: tooluse-replay
          path: ${{ runner.temp }}/tooluse-replay/

      # Drives tasks through the example control plane, a scripted
      # provider and the binary built above (a run, a follow-up run and an
      # abandoned turn), then checks that a provider failure turns into a
      # non-zero exit. See examples/controlplane/README.md.
      - name: Smoke-test the control-plane example
        env:
          STIRRUP: ${{ github.workspace }}/harness/stirrup
        run: |
          set -euo pipefail
          examples/controlplane/smoke.sh success
          examples/controlplane/smoke.sh followup
          examples/controlplane/smoke.sh abandoned-turn
          if examples/controlplane/smoke.sh provider-error; then
            echo "provider-error scenario unexpectedly succeeded" >&2
            exit 1
          fi

      # buf compiles proto/ independently of the committed gen/ output,
      # so this step also catches a .proto edit that was never passed
      # through `buf generate`.
      - name: Install buf
        env:
          # Kept in lockstep with the version contributors run locally
          # (CONTRIBUTING.md#touching-protobuf). BUF_SHA256 is the
          # upstream-published checksum for this exact archive, from the
          # release's sha256.txt; bump both together.
          BUF_VERSION: 1.72.0
          BUF_SHA256: a9c6186cf6fcf062b247345e1b7b12c26f580c1b2a4bbf4d3fe080abf85ceee8
        run: |
          set -euo pipefail
          archive="buf-Linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/${archive}"
          echo "${BUF_SHA256}  /tmp/${archive}" | sha256sum --check --strict -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "/tmp/${archive}" -C "${HOME}/.local/bin" \
            --strip-components=2 buf/bin/buf
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # --as-file-descriptor-set emits a bare
      # google.protobuf.FileDescriptorSet rather than a buf Image, so
      # consumers that never install buf (grpcurl, Envoy, protoc
      # plugins, reflection-less clients) can read it directly. Source
      # info is retained so generated documentation keeps the comments.
      - name: Build proto file descriptor set
        env:
          VERSION_LABEL: ${{ steps.ver.outputs.label }}
        run: |
          set -euo pipefail
          out="stirrup-${VERSION_LABEL}.fds.binpb"
          buf build --as-file-descriptor-set -o "$out"
          sha256sum "$out" > "${out}.sha256"
          ls -l "$out"

      - name: Upload proto file descriptor set artifact
        uses: actions/upload-artifact@v7
        with:
          name: proto-descriptor-set
          path: |
            stirrup-*.fds.binpb
            stirrup-*.fds.binpb.sha256
          if-no-files-found: error
          # Longer than the release job's 7-day working artifacts: this
          # one is a consumable published for downstream clients, not an
          # intermediate handed between jobs in the same run.
          retention-days: 30
