name: Verify (reusable)

# Reusable verify job invoked by ci.yml on every push and by release.yml
# at the start of every tagged release. Centralising it keeps the gate
# identical between routine CI and release builds — if the tagged SHA
# can't pass this, it can't be released.

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref to check out and test. Defaults to github.sha, which is
          correct for ci.yml's per-push invocation. release.yml passes the
          resolved release tag here so a workflow_dispatch retrigger tests the
          tagged commit rather than whatever main currently points at.
        type: string
        required: false
        default: ''

jobs:
  verify:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Empty inputs.ref falls through to actions/checkout's default
          # (github.sha), preserving behaviour for ci.yml callers that
          # don't pass the input.
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            harness/go.mod
            types/go.mod
            eval/go.mod

      - name: Compute version label
        id: ver
        env:
          # Prefer the resolved input ref when set so a tag-push or a
          # workflow_dispatch-triggered tag run produces a label of the
          # tag name rather than "dev". Fall back to GITHUB_REF for the
          # default ci.yml invocation.
          REF: ${{ inputs.ref != '' && format('refs/tags/{0}', inputs.ref) || github.ref }}
        run: |
          if [ "$REF" = "refs/heads/main" ]; then
            label="main"
          elif [[ "$REF" == refs/tags/* ]]; then
            label="${REF#refs/tags/}"
          else
            label="dev"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Run type module tests
        working-directory: types
        run: go test ./...

      - name: Run harness module tests
        working-directory: harness
        run: go test ./...

      - name: Run eval module tests
        working-directory: eval
        run: go test ./...

      # Race-detector pass over the goroutine-heavy packages (executor
      # — which includes egressproxy — provider, and core). Scoped
      # rather than ./... because the full sweep under -race is much
      # slower for little extra concurrency coverage; the targeted set
      # adds only a few seconds. Keep the package list in sync with
      # the `test-race` recipe in the justfile.
      - name: Run race detector on concurrency-heavy packages
        run: go test -race ./harness/internal/executor/... ./harness/internal/provider/... ./harness/internal/core/...

      - name: Build stirrup binary
        working-directory: harness
        env:
          VERSION_LABEL: ${{ steps.ver.outputs.label }}
          COMMIT_SHA: ${{ steps.ver.outputs.sha }}
        run: |
          go build -trimpath \
            -ldflags="-X github.com/rxbynerd/stirrup/types/version.version=${VERSION_LABEL} -X github.com/rxbynerd/stirrup/types/version.commit=${COMMIT_SHA}" \
            ./cmd/stirrup

      - name: Build eval binary
        env:
          VERSION_LABEL: ${{ steps.ver.outputs.label }}
          COMMIT_SHA: ${{ steps.ver.outputs.sha }}
        run: |
          go build -trimpath \
            -ldflags="-X github.com/rxbynerd/stirrup/types/version.version=${VERSION_LABEL} -X github.com/rxbynerd/stirrup/types/version.commit=${COMMIT_SHA}" \
            -o stirrup-eval ./eval/cmd/eval

      # buf compiles proto/ independently of the committed gen/ output,
      # so this step also catches a .proto edit that was never passed
      # through `buf generate`.
      - name: Install buf
        env:
          # Kept in lockstep with the version contributors run locally
          # (CONTRIBUTING.md#touching-protobuf). BUF_SHA256 is the
          # upstream-published checksum for this exact archive, from the
          # release's sha256.txt; bump both together.
          BUF_VERSION: 1.72.0
          BUF_SHA256: a9c6186cf6fcf062b247345e1b7b12c26f580c1b2a4bbf4d3fe080abf85ceee8
        run: |
          set -euo pipefail
          archive="buf-Linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/${archive}"
          echo "${BUF_SHA256}  /tmp/${archive}" | sha256sum --check --strict -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "/tmp/${archive}" -C "${HOME}/.local/bin" \
            --strip-components=2 buf/bin/buf
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # --as-file-descriptor-set emits a bare
      # google.protobuf.FileDescriptorSet rather than a buf Image, so
      # consumers that never install buf (grpcurl, Envoy, protoc
      # plugins, reflection-less clients) can read it directly. Source
      # info is retained so generated documentation keeps the comments.
      - name: Build proto file descriptor set
        env:
          VERSION_LABEL: ${{ steps.ver.outputs.label }}
        run: |
          set -euo pipefail
          out="stirrup-${VERSION_LABEL}.fds.binpb"
          buf build --as-file-descriptor-set -o "$out"
          sha256sum "$out" > "${out}.sha256"
          ls -l "$out"

      - name: Upload proto file descriptor set artifact
        uses: actions/upload-artifact@v7
        with:
          name: proto-descriptor-set
          path: |
            stirrup-*.fds.binpb
            stirrup-*.fds.binpb.sha256
          if-no-files-found: error
          # Longer than the release job's 7-day working artifacts: this
          # one is a consumable published for downstream clients, not an
          # intermediate handed between jobs in the same run.
          retention-days: 30
