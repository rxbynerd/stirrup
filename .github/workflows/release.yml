name: Release

# Triggered by pushing a v*.*.* tag, or re-runnable against an existing
# tag via workflow_dispatch dispatched on that tag's ref
# (`gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z`), so a
# recovery run uses the tagged workflow file and signs with the same
# certificate identity as the original run.
#
# Pipeline (DAG via `needs:` — fan-out after verify):
#   validate-tag        → resolves and validates the input/ref tag once,
#                         and checks the Go module requirements name it
#   verify              → reuses _verify.yml — the tagged SHA must pass tests
#   build-binaries      → matrix of GOOS/GOARCH cells, archives + SHA-256  ┐ parallel
#   sbom                → SPDX + CycloneDX from anchore/sbom-action         │ after
#   changelog           → git log since the previous tag                    │ verify
#   publish-container   → multi-arch image pushed by digest, untagged,      ┘
#                         to GHCR + GAR, + image SBOM uploaded to
#                         Artifact Analysis. A version tag that already
#                         exists is reused, never rebuilt.
#   vulnerability-gate  → Phase 3: queries Artifact Analysis for vulns on
#                         the pushed digest, emits a summary, and files a
#                         tracking issue on CRITICAL+fixable findings.
#                         Currently WARN-only (not in `release.needs`);
#                         see docs/container-publishing.md for promotion
#                         path.
#   eval-extended       → runs the baselined eval suites against the
#                         stronger models (Sonnet 5, Opus 4.8) that the
#                         per-push cheap gate (ci.yml::eval-gate,
#                         GPT-6 Luna) deliberately skips. It also
#                         differs by provider: the gate runs over
#                         OpenRouter, this job over Anthropic WIF, so
#                         a release still exercises the first-party
#                         Anthropic path end to end.
#                         Non-blocking-but-
#                         visible, same philosophy as vulnerability-gate:
#                         not in `release.needs`, so a regression shows
#                         up as a red job on the release run without
#                         holding the release hostage.
#   checksums           → _sign-release.yml: aggregates SHA256SUMS and
#                         IMAGE_DIGESTS, signs SHA256SUMS with keyless
#                         cosign, and attests build provenance for every
#                         listed asset and both images
#   release             → tags the types/ and gen/ Go modules and creates
#                         the GitHub Release
#   tag-images          → points vX.Y.Z (and vX.Y, latest) at the signed
#                         digests; last, so no later step can fail after
#                         an immutable tag exists
#
# Recovery: "Re-run failed jobs" on the run page recovers from a
# transient failure in any job; see docs/deployment.md#release-process.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (must match v*.*.*)'
        required: true
        type: string

# Default to read-only at the workflow level so a compromised action in the
# build/sbom/changelog matrix cannot push commits or create releases. Only
# the `release` job re-grants `contents: write` for the actual publish step,
# and it holds no OIDC token. Signatures and attestations that verifiers
# accept come only from the reusable _sign-release.yml: the other jobs
# holding an OIDC token (publish-*, eval-extended) sign as release.yml,
# an identity no verification command accepts.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # validate-tag is the single source of truth for the release tag. Every
  # downstream job consumes its `tag` output instead of re-deriving and
  # re-validating from `inputs.tag` / `github.ref_name`. Centralising the
  # validation guard here means a workflow_dispatch with a garbage tag
  # ("notasemver") fails fast in this job — no SBOMs are generated, no
  # release is created, and the validation regex lives in exactly one place.
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      # Jobs check out this commit rather than the tag name, so a tag
      # moved mid-run cannot change what later jobs build.
      sha: ${{ github.sha }}
    steps:
      # The pattern is the Semantic Versioning 2.0.0 grammar without
      # build metadata: types/version.SemverOf accepts exactly these
      # labels, so a tag that passes here always yields a non-empty
      # harness_semver in the job `ready` event, and Go accepts it as a
      # module version for the types/ and gen/ tags.
      - name: Resolve and validate tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            if [ "$REF" != "refs/tags/${TAG}" ]; then
              echo "dispatch this workflow on the tag's ref: gh workflow run release.yml --ref ${TAG} -f tag=${TAG} (got ${REF})" >&2
              exit 1
            fi
          else
            TAG="$REF_NAME"
          fi
          num='(0|[1-9][0-9]*)'
          ident='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          pattern="^v${num}\.${num}\.${num}(-${ident}(\.${ident})*)?\$"
          if ! [[ "$TAG" =~ $pattern ]]; then
            echo "tag '$TAG' is not v<semver> (MAJOR.MINOR.PATCH with an optional pre-release, no leading zeros)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # types/ and gen/ are tagged together at this commit, so a
      # requirement of one on the other must already name this version.
      - name: Check the Go module requirements name the release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/release/check-module-requirements.sh "$TAG" types gen

  verify:
    name: Verify
    needs: validate-tag
    uses: ./.github/workflows/_verify.yml
    with:
      ref: ${{ needs.validate-tag.outputs.sha }}

  build-binaries:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    needs: [validate-tag, verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            harness/go.mod
            types/go.mod
            eval/go.mod

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          TAG: ${{ needs.validate-tag.outputs.tag }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          ext=""

          mkdir -p dist
          STIRRUP_OUT="dist/stirrup-${TAG}-${GOOS}-${GOARCH}${ext}"
          EVAL_OUT="dist/stirrup-eval-${TAG}-${GOOS}-${GOARCH}${ext}"

          # Build from repo root so go.work resolves the cross-module
          # imports (eval imports types/version, etc.).
          go build -trimpath \
            -ldflags="-s -w -X github.com/rxbynerd/stirrup/types/version.version=${TAG} -X github.com/rxbynerd/stirrup/types/version.commit=${SHORT_SHA}" \
            -o "${STIRRUP_OUT}" ./harness/cmd/stirrup
          go build -trimpath \
            -ldflags="-s -w -X github.com/rxbynerd/stirrup/types/version.version=${TAG} -X github.com/rxbynerd/stirrup/types/version.commit=${SHORT_SHA}" \
            -o "${EVAL_OUT}" ./eval/cmd/eval

      # The runner is linux/amd64, so only that cell can execute its
      # binary. The label is what harness_semver is derived from.
      - name: Check the binary reports the release version
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        env:
          TAG: ${{ needs.validate-tag.outputs.tag }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          got=$("dist/stirrup-${TAG}-linux-amd64" --version)
          want="stirrup version ${TAG} (${SHORT_SHA})"
          if [ "$got" != "$want" ]; then
            echo "::error::release binary reports '${got}', want '${want}'"
            exit 1
          fi

      - name: Stage archive contents
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          ext=""

          STAGE="staging"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp "dist/stirrup-${TAG}-${GOOS}-${GOARCH}${ext}"      "$STAGE/stirrup${ext}"
          cp "dist/stirrup-eval-${TAG}-${GOOS}-${GOARCH}${ext}" "$STAGE/stirrup-eval${ext}"
          if [ -f LICENSE ]; then cp LICENSE "$STAGE/"; fi
          if [ -f README.md ]; then cp README.md "$STAGE/"; fi

      - name: Archive (tar.gz)
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          ARCHIVE="stirrup-${TAG}-${GOOS}-${GOARCH}.tar.gz"
          # Fixed order, owners and mtimes (the commit time) keep a
          # re-run's archive byte-identical to the first run's.
          mtime="@$(git log -1 --format=%ct HEAD)"
          tar --sort=name --mtime="$mtime" --owner=0 --group=0 --numeric-owner \
            -cf - -C staging . | gzip -n > "$ARCHIVE"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            stirrup-*.tar.gz
            stirrup-*.zip
            stirrup-*.sha256
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: SBOM
    needs: [validate-tag, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}

      # Pinning to an immutable commit defends against an upstream tag
      # being silently retargeted to attacker-controlled code.
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: stirrup-${{ needs.validate-tag.outputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: stirrup-${{ needs.validate-tag.outputs.tag }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Compute SBOM checksums
        run: |
          set -euo pipefail
          for f in stirrup-*.spdx.json stirrup-*.cdx.json; do
            sha256sum "$f" > "${f}.sha256"
          done

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            stirrup-*.spdx.json
            stirrup-*.cdx.json
            stirrup-*.sha256
          if-no-files-found: error
          retention-days: 7

  changelog:
    name: Changelog
    needs: [validate-tag, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required for git describe / git log range.
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        env:
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # --match skips the types/ and gen/ module tags on the same commits.
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
            HEADER="## Changes since ${PREV}"
          else
            RANGE="${TAG}"
            HEADER="## Changes"
          fi
          {
            echo "$HEADER"
            echo
            # --max-count caps a first-tag changelog at 100 lines. Piping
            # into head instead fails the step under pipefail: git log
            # dies of SIGPIPE once head exits.
            git log --max-count=100 --pretty=format:'- %s (%h)' --no-merges "$RANGE"
            echo
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog
          path: CHANGELOG.md
          if-no-files-found: error
          retention-days: 7

  publish-container:
    name: Publish Container
    needs: [validate-tag, verify]
    runs-on: ubuntu-latest
    # Tag-triggered workflows already do not run on forks by default, but
    # mirror the belt-and-braces guard from ci.yml::publish-container so
    # a future change to the trigger condition cannot accidentally
    # surface silent WIF auth failures on someone else's fork.
    #
    # `github.event_name` is intentionally NOT part of this guard: the
    # job must fire on both `push` (tag push from main) and
    # `workflow_dispatch` (operator re-run against an existing tag when
    # a transient GAR/GHCR failure left the release incomplete). Adding
    # an event_name check would silently break the dispatch recovery
    # path. The enforcement layers that DO matter are the repository
    # guard above and the WIF provider's attribute-condition (see
    # docs/container-publishing.md), which pins both
    # `assertion.repository` and the ref to `refs/heads/main` /
    # `refs/tags/v*`. Token issuance is locked at the GCP credential
    # layer, not by this YAML.
    if: github.repository == 'rxbynerd/stirrup'
    # Workflow-level default is contents: read; this job needs id-token
    # for the WIF JWT exchange, packages: write for the GHCR push, and
    # attestations: read to check an existing version tag before reuse.
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: read
    # The digest of the pushed multi-arch manifest is exposed as a
    # job-level output so downstream jobs (vulnerability-gate) can
    # construct the digest-form image URI. Container Analysis APIs
    # (`gcloud artifacts docker images list --show-occurrences`,
    # `gcloud artifacts sbom load --uri`) require digest form because
    # vulnerability and SBOM occurrences must bind to a specific
    # manifest — a tag can move, a digest cannot. `steps.image` holds
    # the digest whether this run pushed the image or reused an
    # already-published version tag.
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      TAG: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Pinned for the same reason as gcp-auth: this action runs
      # inside the job that holds a live GAR access token; a
      # retargeted floating tag could exfiltrate it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # This action receives the GHCR/GAR credentials as `password:` —
      # downstream consumer of the token gcp-auth mints; pinning to an
      # immutable commit is non-negotiable here too.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This action mints a Google access token from the GHA OIDC JWT
      # and is the trust hinge for GAR push — pinning to an immutable
      # commit is non-negotiable.
      #
      # `service_account` + `token_format: access_token` instructs the
      # action to exchange the federated GHA OIDC JWT for a short-lived
      # OAuth2 access token via service-account impersonation. The SA
      # `vars.GAR_PUBLISHER_SA` holds the GAR-push role bindings; the
      # GitHub principalSet only holds `roles/iam.workloadIdentityUser`
      # on the SA (the impersonation grant). This is the canonical
      # google-github-actions/auth pattern — see
      # `docs/container-publishing.md` for the migration rationale
      # (issue #167).
      - name: Authenticate to Google Cloud (WIF + SA impersonation)
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GAR_PUBLISHER_SA }}
          token_format: access_token

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          # GAR demands the literal string "oauth2accesstoken" as the
          # username when the password is a short-lived access token.
          # Substituting a service-account email here fails opaquely —
          # do not "fix" this to something more meaningful.
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      # Version tags are immutable. When this version is already in both
      # registries under one digest and that digest carries this
      # release's provenance attestation (a full re-run or a dispatch
      # after the images were tagged), the job reuses it instead of
      # rebuilding.
      - name: Look up an already-published version tag
        id: existing
        env:
          GHCR_IMAGE: ghcr.io/rxbynerd/stirrup
          GAR_IMAGE_REF: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}
          MIRROR_USERNAME: oauth2accesstoken
          MIRROR_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest=$(scripts/release/existing-release-image.sh "$GHCR_IMAGE" "$GAR_IMAGE_REF" "$TAG" "$GITHUB_SHA")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Pinned for the same reason as login-action: runs inside the
      # credentialled publish job. Only its OCI labels are used; the
      # tag-images job applies the tags.
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/rxbynerd/stirrup
          tags: |
            type=semver,pattern=v{{version}}

      # This action performs the actual push using the live GHCR + GAR
      # credentials; pinning to an immutable commit is non-negotiable
      # here for the same reason as gcp-auth and login-action.
      #
      # The image is pushed by digest only, with no tag, to both
      # registries. Every step after the push can fail, and so can
      # signing; a failed attempt leaves only an untagged manifest, and
      # re-running the job builds and pushes a new one. tag-images
      # applies the version tags once the digest is signed and attested.
      #
      # `id: docker-push` exposes the pushed multi-arch manifest digest
      # to downstream steps as `steps.docker-push.outputs.digest`. The
      # Phase 2 `gcloud artifacts sbom load --uri` calls require the
      # digest form of the image URI (tag form is rejected); the
      # digest is the only stable handle that pins an SBOM to the
      # exact manifest that was pushed.
      #
      # `sbom: true` instructs buildx to attach an SBOM as an OCI
      # in-toto attestation alongside the image. This is NOT a
      # substitute for the `gcloud artifacts sbom load` calls below —
      # the two serve different consumers:
      #
      #   * OCI attestation (sbom: true) — read by cosign/syft
      #     directly off the registry. Useful for ad-hoc image
      #     inspection and downstream tools that follow the
      #     SLSA / in-toto attestation chain.
      #   * Container Analysis occurrence (`sbom load`) — queryable
      #     via `gcloud artifacts sbom list` and consumed by Artifact
      #     Analysis's vulnerability scanner. The format the GCP
      #     console and Phase 3 vulnerability gate will read.
      #
      # Both ship; neither is redundant.
      - name: Build and push container image
        id: docker-push
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,"name=ghcr.io/rxbynerd/stirrup,${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # sbom: true is intentionally release-only;
          # ci.yml::publish-container deliberately omits this to avoid
          # attaching OCI SBOM attestations to the transient :main /
          # :sha-* images it pushes on every main-branch commit (those
          # accumulate as registry noise). Future maintainers: do not
          # "fix" this asymmetry by adding sbom: true to ci.yml without
          # re-reading this comment and the matching note in
          # docs/container-publishing.md.
          sbom: true
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ steps.sha.outputs.short }}

      - name: Resolve the release digest
        id: image
        env:
          EXISTING: ${{ steps.existing.outputs.digest }}
          PUSHED: ${{ steps.docker-push.outputs.digest }}
        run: |
          set -euo pipefail
          digest=${EXISTING:-$PUSHED}
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no image digest (existing '${EXISTING}', pushed '${PUSHED}')"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Check the image reports the release version
        env:
          IMAGE: ghcr.io/rxbynerd/stirrup@${{ steps.image.outputs.digest }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          got=$(docker run --rm --platform linux/amd64 "$IMAGE" --version)
          want="stirrup version ${TAG} (${SHORT_SHA})"
          if [ "$got" != "$want" ]; then
            echo "::error::release image reports '${got}', want '${want}'"
            exit 1
          fi

      # google-github-actions/auth only writes credentials; this
      # action installs the `gcloud` CLI on PATH so the `sbom load`
      # steps below can invoke it. Installed AFTER the push so a
      # failed push short-circuits before we pay the install cost on
      # the common path. The CLI inherits the access_token minted by
      # the earlier gcp-auth step automatically — no separate `gcloud
      # auth` invocation is needed.
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        # `project_id:` here is preferred over passing `--project` on
        # every individual `gcloud` call: it makes the active project
        # self-documenting and breaks the implicit dependency on
        # CLOUDSDK_CORE_PROJECT being propagated from the gcp-auth
        # step's `project_id:`. If a future edit to
        # gcp-auth removes that field for any reason, the
        # `gcloud artifacts sbom load` calls below would otherwise
        # silently target whatever project gcloud infers.
        #
        # `version:` floor is 502.0.0 (released 2024-11-19) — well
        # after `gcloud artifacts sbom load` stabilised in 442.0.0
        # (2023-08), early enough to be on every modern runner image
        # `setup-gcloud` will install. The `>=` constraint allows
        # forward-compatible patch upgrades while preventing a
        # rollback to a version that lacks the subcommand.
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          version: '>= 502.0.0'

      # Pinning to an immutable commit defends against an upstream tag
      # being silently retargeted to attacker-controlled code.
      #
      # Unlike the source-tree SBOM (which uses `path: .` and
      # describes the Go module graph), the image SBOM uses `image:`
      # with the digest form of the pushed manifest. anchore/sbom-action
      # shells out to syft against the pushed image, capturing the
      # distroless base layers and everything else actually present in
      # the deployed container. The two SBOMs are complementary, not
      # alternatives — Artifact Analysis vulnerability mapping needs
      # the image SBOM specifically because vulnerabilities live in
      # what got shipped, not in the source graph.
      #
      # upload-artifact / upload-release-assets are false: image SBOMs
      # go ONLY to Artifact Analysis. The source-tree SBOMs in the
      # release-asset bundle already cover the GitHub Release audience.
      # github-token: "" suppresses the implicit GITHUB_TOKEN this job
      # holds (with `packages: write` for the GHCR push above). The
      # action does not need GHCR-push authority for our usage —
      # `upload-artifact: false` and `upload-release-assets: false`
      # already disable its token-gated sub-steps. Capability hygiene:
      # do not pass write-scoped tokens into a third-party compiled
      # bundle when none of its code paths require them. The image
      # itself is fetched via the Docker daemon credential store
      # (already logged in via docker/login-action above), not via
      # this token.
      - name: Generate image SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: stirrup-${{ needs.validate-tag.outputs.tag }}.image.spdx.json
          upload-artifact: false
          upload-release-assets: false
          github-token: ""

      - name: Generate image CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}@${{ steps.image.outputs.digest }}
          format: cyclonedx-json
          output-file: stirrup-${{ needs.validate-tag.outputs.tag }}.image.cdx.json
          upload-artifact: false
          upload-release-assets: false
          github-token: ""

      # `gcloud artifacts sbom load --uri` REQUIRES the digest form of
      # the image URI (`@sha256:...`). Tag-form URIs are rejected by
      # the gcloud reference because an SBOM must bind to a specific
      # manifest, and a tag can move. The digest comes from the
      # `id: image` step, which resolves the pushed or reused digest.
      #
      # These commands run as the impersonated service account from
      # the `id: gcp-auth` step earlier — google-github-actions/auth
      # exports ADC into the runner environment, and setup-gcloud
      # honours it transparently. No explicit `gcloud auth activate`
      # is needed. The four IAM roles `sbom load` requires
      # (containeranalysis.notes.editor / .occurrences.editor /
      # .notes.attacher / storage.objectAdmin) are bound to
      # vars.GAR_PUBLISHER_SA by the Phase 1 bootstrap documented in
      # docs/container-publishing.md.
      - name: Upload image SPDX SBOM to Artifact Analysis
        env:
          IMAGE_URI: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}@${{ steps.image.outputs.digest }}
          SBOM_FILE: stirrup-${{ needs.validate-tag.outputs.tag }}.image.spdx.json
        run: |
          set -euo pipefail
          gcloud artifacts sbom load \
            --source "${SBOM_FILE}" \
            --uri "${IMAGE_URI}"

      - name: Upload image CycloneDX SBOM to Artifact Analysis
        env:
          IMAGE_URI: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}@${{ steps.image.outputs.digest }}
          SBOM_FILE: stirrup-${{ needs.validate-tag.outputs.tag }}.image.cdx.json
        run: |
          set -euo pipefail
          gcloud artifacts sbom load \
            --source "${SBOM_FILE}" \
            --uri "${IMAGE_URI}"

  # Release-time publish of the sandbox image (Dockerfile.sandbox) —
  # the `--image` the container/k8s/k8s-sandbox executors run agent
  # workloads in. Mirrors publish-container's GHCR + GAR dual-publish,
  # semver tagging, and SBOM posture; see the comments there for the
  # action-pin provenance and the WIF/GAR authentication rationale.
  # Deltas from publish-container: no VERSION/COMMIT build-args (the
  # image contains no Go build), and the GAR image name is
  # `${GAR_IMAGE}-sandbox` alongside the harness image in the same
  # repository.
  publish-sandbox-container:
    name: Publish Sandbox Container
    needs: [validate-tag, verify]
    runs-on: ubuntu-latest
    if: github.repository == 'rxbynerd/stirrup'
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: read
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      TAG: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud (WIF + SA impersonation)
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GAR_PUBLISHER_SA }}
          token_format: access_token

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          # GAR demands the literal string "oauth2accesstoken" as the
          # username when the password is a short-lived access token —
          # see publish-container above.
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      # Same reuse rule as publish-container.
      - name: Look up an already-published version tag
        id: existing
        env:
          GHCR_IMAGE: ghcr.io/rxbynerd/stirrup-sandbox
          GAR_IMAGE_REF: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}-sandbox
          MIRROR_USERNAME: oauth2accesstoken
          MIRROR_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest=$(scripts/release/existing-release-image.sh "$GHCR_IMAGE" "$GAR_IMAGE_REF" "$TAG" "$GITHUB_SHA")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/rxbynerd/stirrup-sandbox
          tags: |
            type=semver,pattern=v{{version}}

      # Pushed by digest only, like publish-container; tag-images applies
      # the tags after signing.
      - name: Build and push sandbox image
        id: docker-push
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.sandbox
          platforms: linux/amd64,linux/arm64
          outputs: type=image,"name=ghcr.io/rxbynerd/stirrup-sandbox,${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}-sandbox",push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true

      - name: Resolve the release digest
        id: image
        env:
          EXISTING: ${{ steps.existing.outputs.digest }}
          PUSHED: ${{ steps.docker-push.outputs.digest }}
        run: |
          set -euo pipefail
          digest=${EXISTING:-$PUSHED}
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no image digest (existing '${EXISTING}', pushed '${PUSHED}')"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          version: '>= 502.0.0'

      # Image SBOMs matter more for the sandbox than for the distroless
      # harness image: the Debian base is where the CVEs live. Same
      # digest-form URI requirement and IAM posture as publish-container.
      - name: Generate image SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}-sandbox@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: stirrup-sandbox-${{ needs.validate-tag.outputs.tag }}.image.spdx.json
          upload-artifact: false
          upload-release-assets: false
          github-token: ""

      - name: Generate image CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}-sandbox@${{ steps.image.outputs.digest }}
          format: cyclonedx-json
          output-file: stirrup-sandbox-${{ needs.validate-tag.outputs.tag }}.image.cdx.json
          upload-artifact: false
          upload-release-assets: false
          github-token: ""

      - name: Upload image SPDX SBOM to Artifact Analysis
        env:
          IMAGE_URI: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}-sandbox@${{ steps.image.outputs.digest }}
          SBOM_FILE: stirrup-sandbox-${{ needs.validate-tag.outputs.tag }}.image.spdx.json
        run: |
          set -euo pipefail
          gcloud artifacts sbom load \
            --source "${SBOM_FILE}" \
            --uri "${IMAGE_URI}"

      - name: Upload image CycloneDX SBOM to Artifact Analysis
        env:
          IMAGE_URI: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}-sandbox@${{ steps.image.outputs.digest }}
          SBOM_FILE: stirrup-sandbox-${{ needs.validate-tag.outputs.tag }}.image.cdx.json
        run: |
          set -euo pipefail
          gcloud artifacts sbom load \
            --source "${SBOM_FILE}" \
            --uri "${IMAGE_URI}"

  # Phase 3 of issue #159: query Artifact Analysis for vulnerabilities
  # on the just-pushed image and emit a summary. CURRENT MODE IS WARN
  # — the gate never fails the workflow, regardless of how many
  # vulnerabilities are found. A critical+fixable finding files a
  # tracking issue and the release proceeds. This is a deliberate
  # calibration window: we want to observe scan timing and false
  # positives against real release images before promoting to a
  # blocking gate. Promotion to block is a separate small PR — flip
  # the `mode:` input below from `warn` to `block` and add
  # `vulnerability-gate` to `release.needs`.
  #
  # The job is intentionally NOT in `release.needs` so the warn
  # posture is structural, not just behavioural.
  #
  # The job body lives in `_vuln-scan.yml` so the same query +
  # report + issue-filing logic is reused by `vuln-scan.yml`
  # (workflow_dispatch) for ad-hoc queries against any digest in
  # GAR — e.g. re-querying an older release after a fresh CVE
  # drops. See docs/container-publishing.md for the on-demand
  # dispatch flow.
  vulnerability-gate:
    name: Vulnerability gate (warn mode)
    needs: [validate-tag, publish-container]
    # Same repository guard as publish-container: forks neither have
    # the vars.* nor can mint a WIF token against this repo's pool, so
    # skip rather than fail confusingly. The reusable workflow also
    # guards on this; doubling up is belt-and-braces.
    if: github.repository == 'rxbynerd/stirrup'
    # Least-privilege permission set:
    #   * contents: read    — checkout is not strictly required here,
    #                          but keeping the workflow-level default
    #                          explicit avoids surprising future edits.
    #   * id-token: write   — re-required because GHA OIDC tokens are
    #                          per-job; publish-container's token is
    #                          not reusable across job boundaries.
    #   * issues: write     — `gh issue create` inside the reusable
    #                          workflow needs it.
    # `packages: write` is deliberately omitted — the gate never
    # pushes anything to GHCR or anywhere else.
    permissions:
      contents: read
      id-token: write
      issues: write
    uses: ./.github/workflows/_vuln-scan.yml
    with:
      image_uri: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}@${{ needs.publish-container.outputs.digest }}
      tag: ${{ needs.validate-tag.outputs.tag }}
      mode: warn

  # Same warn-only gate for the sandbox image. The `-sandbox` suffix on
  # the tag label keeps its tracking issues distinguishable from the
  # harness image's, and means an operator setting
  # vars.STIRRUP_RELEASE_VULN_OVERRIDE for the release tag bypasses only
  # the harness gate — the sandbox gate needs its own suffixed override.
  vulnerability-gate-sandbox:
    name: Vulnerability gate — sandbox (warn mode)
    needs: [validate-tag, publish-sandbox-container]
    if: github.repository == 'rxbynerd/stirrup'
    permissions:
      contents: read
      id-token: write
      issues: write
    uses: ./.github/workflows/_vuln-scan.yml
    with:
      image_uri: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}-sandbox@${{ needs.publish-sandbox-container.outputs.digest }}
      tag: ${{ needs.validate-tag.outputs.tag }}-sandbox
      mode: warn

  # Extended eval sweep: the same baselined suites the per-push gate
  # runs on openai/gpt-6-luna (ci.yml::eval-gate), re-run against the
  # stronger models a release is expected to work well with.
  # Self-pinned provider-quirks-* suites are not part of the sweep: a
  # --model override would replace the model they pin, so they stay
  # opt-in through ci.yml's run_quirks_suites dispatch input.
  # Every compared suite is reported in the job summary, per model.
  #
  # Intentionally NOT in `release.needs` — mirroring the
  # vulnerability-gate's warn posture, the non-blocking stance is
  # structural: a regression here paints the release run red
  # (per-model matrix cell fails on the compare step's exit code) but
  # never blocks the release itself.
  # Promotion to blocking is a one-line change: add `eval-extended`
  # to `release.needs`.
  #
  # Anthropic auth uses the same WIF identifiers as ci.yml::eval-gate.
  # If the Anthropic-side federation rule ever constrains the OIDC
  # ref claim to refs/heads/main, the exchange fails for tag refs and
  # this job goes red without affecting the release — widen the rule
  # in the Anthropic console rather than weakening this job.
  eval-extended:
    name: Extended Eval (${{ matrix.model }})
    needs: [validate-tag, verify]
    runs-on: ubuntu-latest
    # Same repository guard as publish-container: forks cannot mint a
    # WIF token this repo's federation rule accepts, so skip rather
    # than fail confusingly.
    if: github.repository == 'rxbynerd/stirrup'
    permissions:
      contents: read
      id-token: write
    strategy:
      # One red model must not cancel the other's signal — the point
      # of the matrix is a per-model verdict.
      fail-fast: false
      matrix:
        # The models a release is checked against. Edit this list to
        # change them; nothing else in the job names a model.
        model:
          - claude-sonnet-5
          - claude-opus-4-8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            harness/go.mod
            types/go.mod
            eval/go.mod

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          TAG: ${{ needs.validate-tag.outputs.tag }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          go build -trimpath \
            -ldflags="-X github.com/rxbynerd/stirrup/types/version.version=${TAG} -X github.com/rxbynerd/stirrup/types/version.commit=${SHORT_SHA}" \
            -o stirrup ./harness/cmd/stirrup
          go build -trimpath \
            -ldflags="-X github.com/rxbynerd/stirrup/types/version.version=${TAG} -X github.com/rxbynerd/stirrup/types/version.commit=${SHORT_SHA}" \
            -o stirrup-eval ./eval/cmd/eval

      # Mirrors ci.yml::eval-gate's guard pair (check-suites +
      # check-creds) so the two eval surfaces degrade identically.
      # The WIF-eligibility leg is implied by the job-level repository
      # guard, so only OIDC availability is checked here.
      - name: Check for baselined eval suites
        id: check-suites
        shell: bash
        run: |
          shopt -s nullglob
          found=false
          for suite in eval/suites/*.hcl; do
            name=$(basename "$suite")
            name="${name%.*}"
            case "$name" in
              provider-quirks-*) continue ;;
            esac
            if [ -f "eval/baselines/${name}.json" ]; then
              found=true
              break
            fi
          done
          if [ "$found" = "true" ]; then
            echo "has_suites=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_suites=false" >> "$GITHUB_OUTPUT"
            echo "No baselined eval suites found — skipping extended eval"
          fi

      - name: Check Anthropic credentials
        id: check-creds
        if: steps.check-suites.outputs.has_suites == 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ] || [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "has_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Anthropic credentials available. Skipping extended eval runs."
          fi

      # Preflight the credential exchange so a WIF refusal for a tag
      # ref surfaces as a named credential failure instead of a page
      # of bogus per-task "regressions" (the failure mode observed in
      # ci.yml run 29168741554 for a branch ref). Unlike the per-push
      # gate's ref-sensitive skip, a failed preflight here FAILS the
      # matrix cell outright: this job is already structurally
      # non-blocking (not in release.needs), and a green-but-vacuous
      # sweep on a release run would misread as "evals passed". If
      # the federation rule refuses refs/tags/v* tokens, widen it in
      # the Anthropic console — the error below says exactly that.
      - name: Preflight Anthropic credential exchange
        if: steps.check-suites.outputs.has_suites == 'true' && steps.check-creds.outputs.has_credentials == 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MODEL: ${{ matrix.model }}
        run: |
          mkdir -p preflight-workspace
          if ! ./stirrup harness --dry-run \
              --model "$EVAL_MODEL" \
              --workspace preflight-workspace \
              --trace preflight-trace.jsonl \
              --prompt "preflight" \
              --anthropic-federation-rule-id fdrl_01QJMFE86qFDdWzQXEekhYjY \
              --anthropic-organization-id 5848ccdc-495f-490b-9275-2caab9db344d \
              --anthropic-service-account-id svac_01Tf7i7VwZm6WRAFjNAawPw9 \
              --anthropic-from-github-actions; then
            echo "::error::Extended eval preflight failed for ${GITHUB_REF}: credential resolution or the provider probe failed (see the preflight report above). This is a credential/infrastructure failure, NOT an eval regression. If the WIF exchange refused a tag-ref OIDC token, widen federation rule fdrl_01QJMFE86qFDdWzQXEekhYjY in the Anthropic console to accept refs/tags/v*. The release itself is unaffected (this job is not in release.needs)."
            exit 1
          fi

      - name: Run baselined eval suites
        if: steps.check-suites.outputs.has_suites == 'true' && steps.check-creds.outputs.has_credentials == 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MODEL: ${{ matrix.model }}
        run: |
          shopt -s nullglob
          mkdir -p eval/results
          for suite in eval/suites/*.hcl; do
            name=$(basename "$suite")
            name="${name%.*}"
            case "$name" in
              provider-quirks-*)
                echo "Skipping ${name} — self-pinned quirk suite; --model would override its pin (run it via ci.yml workflow_dispatch with run_quirks_suites=true)"
                continue
                ;;
            esac
            if [ ! -f "eval/baselines/${name}.json" ]; then
              echo "Skipping ${name} — no baseline (unbaselined suites are opt-in; see eval/suites/README.md)"
              continue
            fi
            ./stirrup-eval run \
              --suite "$suite" \
              --harness "$GITHUB_WORKSPACE/stirrup" \
              --model "$EVAL_MODEL" \
              --output "eval/results/${name}" \
              --junit "eval/results/${name}/junit.xml" \
              --anthropic-federation-rule-id fdrl_01QJMFE86qFDdWzQXEekhYjY \
              --anthropic-organization-id 5848ccdc-495f-490b-9275-2caab9db344d \
              --anthropic-service-account-id svac_01Tf7i7VwZm6WRAFjNAawPw9 \
              --anthropic-from-github-actions
          done

      # The compare step's exit code is this job's verdict: a
      # regression against the committed baseline turns the matrix
      # cell red. The release proceeds regardless (see the job
      # comment) — the red cell is the operator's cue to investigate
      # before announcing the release.
      #
      # Every suite is compared before the step exits, so one
      # regression does not hide another. compare exits 1 on a block
      # and 2 when it could not run; the worst code becomes the
      # step's exit code. The comparison JSON is kept next to each
      # result for the summary step.
      - name: Compare against baseline
        if: steps.check-suites.outputs.has_suites == 'true' && steps.check-creds.outputs.has_credentials == 'true'
        shell: bash
        env:
          EVAL_MODEL: ${{ matrix.model }}
        run: |
          shopt -s nullglob
          worst=0
          for result_dir in eval/results/*/; do
            name=$(basename "$result_dir")
            result="${result_dir}result.json"
            baseline="eval/baselines/${name}.json"
            if [ ! -f "$baseline" ]; then
              echo "No baseline found at $baseline — skipping comparison"
              continue
            fi
            report="${result_dir}compare.txt"
            rc=0
            ./stirrup-eval compare \
              --current "$result" \
              --baseline "$baseline" \
              --output "${result_dir}comparison.json" > "$report" 2>&1 || rc=$?
            cat "$report"
            if [ "$rc" -eq 1 ]; then
              echo "::error::Extended eval for ${name} on ${EVAL_MODEL}: block"
            elif [ "$rc" -ge 2 ]; then
              echo "::error::Extended eval for ${name} on ${EVAL_MODEL}: compare did not run (exit ${rc})"
            fi
            if [ "$rc" -gt "$worst" ]; then
              worst=$rc
            fi
          done
          exit "$worst"

      # One table per matrix cell, so the run page states which models
      # the release was checked against and how each suite fared. Pass
      # rate is the judge verdict; healthy pass rate also requires the
      # harness to have exited zero with a success outcome. Results
      # written before run health existed show n/a.
      - name: Publish eval summary
        if: always() && steps.check-suites.outputs.has_suites == 'true' && steps.check-creds.outputs.has_credentials == 'true'
        shell: bash
        env:
          EVAL_MODEL: ${{ matrix.model }}
        run: |
          shopt -s nullglob
          {
            echo "### Extended eval: ${EVAL_MODEL}"
            echo
            echo "| Suite | Gate | Pass rate | Healthy pass rate | Healthy runs | Tasks | Runs |"
            echo "|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for result_dir in eval/results/*/; do
            name=$(basename "$result_dir")
            result="${result_dir}result.json"
            [ -f "$result" ] || continue
            if [ -f "${result_dir}comparison.json" ]; then
              gate=$(jq -r '.summary.gate // "unknown"' "${result_dir}comparison.json")
            elif [ -f "eval/baselines/${name}.json" ]; then
              gate="not compared"
            else
              gate="no baseline"
            fi
            jq -r --arg name "$name" --arg gate "$gate" '
              def pct: if . == null then "n/a" else "\(. * 1000 | round / 10)%" end;
              [.tasks[] | if ((.trials // []) | length) > 0 then .trials[] else . end] as $runs
              | ($runs | map(select(.runHealth != null)) | length) as $measured
              | ($runs | map(select(.runHealth == "healthy")) | length) as $healthy
              | "| \($name) | \($gate) | \(.passRate | pct) | \(.healthyPassRate | pct) | "
                + (if $measured == 0 then "n/a" else "\($healthy)/\($runs | length)" end)
                + " | \(.tasks | length) | \($runs | length) |"
            ' "$result" >> "$GITHUB_STEP_SUMMARY"
          done
          for result_dir in eval/results/*/; do
            name=$(basename "$result_dir")
            gate=pass
            if [ -f "${result_dir}comparison.json" ]; then
              gate=$(jq -r '.summary.gate // "unknown"' "${result_dir}comparison.json")
            fi
            if [ "$gate" != pass ] && [ -f "${result_dir}compare.txt" ]; then
              {
                echo
                echo "#### ${name}: ${gate}"
                echo
                echo '```text'
                cat "${result_dir}compare.txt"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload eval results
        if: always() && steps.check-suites.outputs.has_suites == 'true' && steps.check-creds.outputs.has_credentials == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results-extended-${{ matrix.model }}
          path: eval/results/
          retention-days: 30

  checksums:
    name: Checksums, signature and provenance
    needs: [validate-tag, build-binaries, sbom, changelog, publish-container, publish-sandbox-container]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_sign-release.yml
    with:
      tag: ${{ needs.validate-tag.outputs.tag }}
      sha: ${{ needs.validate-tag.outputs.sha }}
      harness-digest: ${{ needs.publish-container.outputs.digest }}
      sandbox-digest: ${{ needs.publish-sandbox-container.outputs.digest }}

  release:
    name: Publish Release
    needs: [validate-tag, verify, checksums]
    runs-on: ubuntu-latest
    # Only this job needs write access to the repository, for the module
    # tags and the release. Granting it at the job level (rather than the
    # workflow level) keeps the blast radius of any compromise in the
    # matrix jobs minimal.
    permissions:
      contents: write
    env:
      TAG: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: .

      - name: Verify the downloaded assets against SHA256SUMS
        working-directory: release
        run: sha256sum -c SHA256SUMS

      # Published assets are never replaced with different bytes. A
      # dispatch rebuilds the SBOMs, which never reproduce, so when only
      # they differ the published set is kept and the job goes on to the
      # module tags and the image tags.
      - name: Compare with the published release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          action=$(scripts/release/compare-published-release.sh "$TAG" release)
          case "$action" in
            upload | keep) ;;
            *)
              echo "::error::unexpected comparison result '${action}'"
              exit 1
              ;;
          esac
          echo "action=${action}" >> "$GITHUB_OUTPUT"

      # types/ and gen/ are the modules a control plane imports. Both
      # receive every release version together, at the release commit;
      # harness/, eval/ and examples/ build binaries and are not tagged.
      - name: Tag the Go modules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/release/tag-go-modules.sh "$TAG" "$(git rev-parse HEAD)" types gen

      # This action runs with the job-scoped `contents: write` token,
      # making it the highest-trust step in the workflow — pinning to
      # an immutable commit is non-negotiable here.
      - name: Create GitHub Release
        if: steps.published.outputs.action == 'upload'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: release-notes.md
          draft: false
          # Treat any tag with a hyphen (e.g. v1.2.3-rc.1) as a prerelease.
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/stirrup-*.tar.gz
            release/stirrup-*.spdx.json
            release/stirrup-*.cdx.json
            release/IMAGE_DIGESTS
            release/SHA256SUMS
            release/SHA256SUMS.sigstore.json

      # Fetching the version through the public Go module proxy confirms
      # `go get .../types@<tag>` resolves, and caches it there.
      - name: Check the module versions resolve through proxy.golang.org
        run: |
          set -euo pipefail
          for module in types gen; do
            url="https://proxy.golang.org/github.com/${GITHUB_REPOSITORY}/${module}/@v/${TAG}.info"
            got=$(curl --silent --show-error --fail --retry 5 --retry-delay 10 --retry-all-errors --max-time 60 "$url" | jq -r '.Version')
            if [ "$got" != "$TAG" ]; then
              echo "::error::${url} reported version '${got}', want ${TAG}"
              exit 1
            fi
            echo "github.com/${GITHUB_REPOSITORY}/${module}@${TAG} resolves"
          done

  # The last job of a release. The publish jobs push both images by
  # digest only, so nothing earlier in the run, including signing and
  # the GitHub Release, can fail after an immutable version tag exists.
  # This job points vX.Y.Z at the signed, attested digest in GHCR and
  # Artifact Registry, then moves vX.Y and latest when this is the
  # newest release of its line and overall. It is idempotent: re-running
  # it after a partial failure adds only the missing tags.
  tag-images:
    name: Tag release images
    needs: [validate-tag, publish-container, publish-sandbox-container, release]
    runs-on: ubuntu-latest
    if: github.repository == 'rxbynerd/stirrup'
    # id-token for the GAR WIF exchange, packages: write for the GHCR
    # tags, attestations: read to check the digest before tagging it.
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: read
    env:
      TAG: ${{ needs.validate-tag.outputs.tag }}
      COMMIT: ${{ needs.validate-tag.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
          persist-credentials: false

      - name: Authenticate to Google Cloud (WIF + SA impersonation)
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GAR_PUBLISHER_SA }}
          token_format: access_token

      - name: Choose the moving tags
        id: moving
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref' >refs
          tags=$(sed 's|^refs/tags/||' refs | scripts/release/moving-tags.sh "$TAG" | tr '\n' ' ')
          echo "Moving tags for ${TAG}: ${tags:-none}"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Tag the harness image
        env:
          GHCR_IMAGE: ghcr.io/rxbynerd/stirrup
          GAR_IMAGE_REF: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}
          DIGEST: ${{ needs.publish-container.outputs.digest }}
          MOVING: ${{ steps.moving.outputs.tags }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ github.token }}
          MIRROR_USERNAME: oauth2accesstoken
          MIRROR_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # MOVING is a space-separated tag list.
          scripts/release/apply-release-tags.sh "$GHCR_IMAGE" "$GAR_IMAGE_REF" "$DIGEST" "$TAG" "$COMMIT" $MOVING

      - name: Tag the sandbox image
        env:
          GHCR_IMAGE: ghcr.io/rxbynerd/stirrup-sandbox
          GAR_IMAGE_REF: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.GAR_IMAGE }}-sandbox
          DIGEST: ${{ needs.publish-sandbox-container.outputs.digest }}
          MOVING: ${{ steps.moving.outputs.tags }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ github.token }}
          MIRROR_USERNAME: oauth2accesstoken
          MIRROR_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # MOVING is a space-separated tag list.
          scripts/release/apply-release-tags.sh "$GHCR_IMAGE" "$GAR_IMAGE_REF" "$DIGEST" "$TAG" "$COMMIT" $MOVING
