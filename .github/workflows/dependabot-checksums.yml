name: Dependabot checksums

# Dependabot updates each module's go.mod and go.sum but leaves the
# workspace go.work.sum stale, which fails the checksum check in
# _verify.yml. On every Dependabot push to a gomod update branch, this
# workflow regenerates the checksum files, commits them to that branch,
# and dispatches verify and lint against the new commit. A push made with
# GITHUB_TOKEN starts no push-triggered workflow, but a dispatch does.

on:
  push:
    branches: ['dependabot/go_modules/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-checksums-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate checksums
    if: github.event_name == 'push' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            harness/go.mod
            types/go.mod
            eval/go.mod
            examples/controlplane/go.mod

      # Loading every package, tests included, records the checksums a
      # build and test run would, without compiling or running any
      # dependency code while this job holds a write token.
      - name: Load every workspace package
        run: |
          set -euo pipefail
          modules="$(go work edit -json | jq -r '.Use[].DiskPath')"
          for dir in $modules; do
            (cd "$dir" && go list -deps -test ./... > /dev/null)
          done

      - name: Commit regenerated checksum files
        id: commit
        run: |
          set -euo pipefail
          git add -A -- go.work.sum ':(glob)**/go.sum'
          if git diff --cached --quiet; then
            echo "Checksum files are already current."
            exit 0
          fi
          other="$({ git diff --name-only; git ls-files --others --exclude-standard; } | tr '\n' ' ')"
          if [ -n "$other" ]; then
            echo "::error::loading packages changed files other than checksums: ${other}"
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -F - <<'EOF'
          build: regenerate workspace checksums for this update

          Dependabot updates each module's go.mod and go.sum but not the
          workspace go.work.sum. This commit is generated by the Dependabot
          checksums workflow; Dependabot replaces it when it rebases.

          [dependabot skip]
          EOF
          git show --stat --format='%h %s' HEAD
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push the commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF}"

      - name: Dispatch verify and lint on the new commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run dependabot-checksums.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          gh workflow run lint.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  verify:
    name: Verify
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/_verify.yml
