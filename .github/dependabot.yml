version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns: ["*"]

  # These updates leave the workspace go.work.sum stale; the
  # dependabot-checksums workflow commits the regenerated file to each
  # update branch.
  - package-ecosystem: gomod
    directory: /harness
    schedule:
      interval: "daily"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /types
    schedule:
      interval: "daily"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /eval
    schedule:
      interval: "daily"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /gen
    schedule:
      interval: "daily"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /examples/controlplane
    schedule:
      interval: "daily"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Picks up both Dockerfile and Dockerfile.sandbox, bumping the tag
  # and the pinned digest together.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: "daily"
